<svg xmlns="http://www.w3.org/2000/svg" width="620" height="34" role="img" aria-label="Currently Exploring: AI/ML, GenAI, CRM Architecture, Japanese">
  <defs>
    <!-- Single-hue purple fade -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <!-- Glass shimmer -->
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.10"/>
    </linearGradient>
    <!-- Glow border (purple) -->
    <linearGradient id="border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#c4b5fd" stop-opacity="0.95"/>
      <stop offset="50%"  stop-color="#a855f7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="glow" x="-3%" y="-30%" width="106%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#c026d3" flood-opacity="0.45"/>
    </filter>
    <filter id="tshadow" x="-8%" y="-60%" width="116%" height="300%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#3b0764" flood-opacity="0.85"/>
    </filter>
  </defs>
  <rect x="1" y="1" width="618" height="32" rx="16" fill="url(#bg)" filter="url(#glow)"/>
  <rect x="1" y="1" width="618" height="32" rx="16" fill="url(#shimmer)"/>
  <rect x="1.5" y="1.5" width="617" height="31" rx="15.5" fill="none" stroke="url(#border)" stroke-width="1.2"/>
  <text x="310" y="22" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff" filter="url(#tshadow)" letter-spacing="0.7">
    CURRENTLY EXPLORING • AI/ML • GENAI • CRM ARCHITECTURE • JAPANESE
  </text>
</svg>
