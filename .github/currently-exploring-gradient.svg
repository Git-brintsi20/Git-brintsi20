  <rect x="1" y="1" width="618" height="32" rx="16" fill="url(#exploreGradient)" filter="url(#boxShadow)" />
  <text x="310" y="22" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff" filter="url(#textShadow)" letter-spacing="0.5">
