  </defs>

  <rect x="1" y="1" width="978" height="36" rx="8" fill="url(#badgeGradient)" filter="url(#boxShadow)" />

  <text x="490" y="25" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="800" fill="#ffffff" filter="url(#textShadow)" letter-spacing="0.5">
