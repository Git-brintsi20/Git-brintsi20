<svg xmlns="http://www.w3.org/2000/svg" width="980" height="38" role="img" aria-label="Open to Work: SDE Roles | Backend | Full-Stack | AI Internships | Open Source (2026)">
  <defs>
    <linearGradient id="badgeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="50%" stop-color="#c026d3" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="boxShadow" x="-5%" y="-30%" width="110%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#7c3aed" flood-opacity="0.4" />
    </filter>
    <filter id="textShadow" x="-10%" y="-40%" width="120%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#4a0072" flood-opacity="0.7" />
