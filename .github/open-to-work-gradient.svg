<svg xmlns="http://www.w3.org/2000/svg" width="980" height="38" role="img" aria-label="Open to Work: SDE Roles | Backend | Full-Stack | AI Internships | Open Source (2026)">
  <defs>
    <linearGradient id="badgeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="28%" stop-color="#06b6d4" />
      <stop offset="56%" stop-color="#3b82f6" />
      <stop offset="78%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="edgeStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#f9a8d4" stop-opacity="0.75" />
    </linearGradient>
    <radialGradient id="softGlow" cx="50%" cy="-20%" r="85%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.28" />
    </filter>
  </defs>

  <rect x="1" y="1" width="978" height="36" rx="8" fill="url(#badgeGradient)" filter="url(#softShadow)" />
  <rect x="1" y="1" width="978" height="36" rx="8" fill="url(#softGlow)" />
  <rect x="1.5" y="1.5" width="977" height="35" rx="7.5" fill="none" stroke="url(#edgeStroke)" stroke-width="1" />

  <text x="490" y="25" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">
    OPEN TO WORK • SDE ROLES • BACKEND • FULL-STACK • AI INTERNSHIPS • OPEN SOURCE (2026)
