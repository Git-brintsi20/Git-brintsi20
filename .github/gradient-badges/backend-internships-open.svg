<svg xmlns="http://www.w3.org/2000/svg" width="280" height="28" role="img" aria-label="Backend Internships: Open">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="55%"  stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="glow" x="-3%" y="-30%" width="106%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#c026d3" flood-opacity="0.4"/>
    </filter>
    <filter id="tshadow" x="-8%" y="-80%" width="116%" height="360%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#3b0764" flood-opacity="0.8"/>
    </filter>
  </defs>
  <rect width="280" height="28" rx="7" fill="url(#bg)" filter="url(#glow)"/>
  <rect width="280" height="28" rx="7" fill="url(#shine)"/>
  <rect x="0.75" y="0.75" width="278.5" height="26.5" rx="6.5" fill="none" stroke="#c4b5fd" stroke-opacity="0.7" stroke-width="1"/>
  <text x="140" y="19" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" fill="#ffffff" filter="url(#tshadow)" letter-spacing="0.5">BACKEND INTERNSHIPS • OPEN</text>
</svg>
